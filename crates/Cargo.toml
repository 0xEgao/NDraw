[workspace]
resolver = "3"
members = [
    "ndraw-proto",
    "ndraw-den",
    "ndraw-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ndraw-proto = { path = "ndraw-proto" }
ndraw-den = { path = "ndraw-den" }

# Async runtime and networking
axum = { version = "0.8.9", features = ["ws", "json"] }
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1.53", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "signal",
] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Protocol and HTTP JSON
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }

# Domain and validation
rand = "0.9"
strsim = "0.11"
thiserror = "2"
unicode-normalization = "0.1"
unicode-segmentation = "1"

# Server state and middleware
dashmap = "6"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
    "cors",
    "trace",
    "request-id",
    "limit",
    "timeout",
    "catch-panic",
] }

# Telemetry
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Binary applications and load testing
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
url = "2"

# Tests and wire fixtures
hex = "0.4"
proptest = "1"
